name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Check the entry points parse
        run: |
          node --check src/server.js
          node --check scripts/queue-digests.js

      - name: Run tests
        run: node --test --test-reporter=spec | tee test-results.txt

      - name: Keep the test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.txt
