[project]
name = "usagebill"
version = "1.4.0"
description = "Import metered usage, bill customers monthly, and hand invoices to accounting."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
usagebill = "usagebill.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["usagebill"]

[tool.ruff]
line-length = 120
target-version = "py312"
