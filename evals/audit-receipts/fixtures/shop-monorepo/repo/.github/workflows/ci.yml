name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Check syntax
        run: |
          for file in $(git ls-files '*.js'); do
            node --check "$file"
          done

      - name: Test
        run: node --test --test-reporter=spec 2>&1 | tee test-output.txt

      - name: Keep the test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: test-output.txt
          retention-days: 14
